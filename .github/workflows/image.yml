name: Build and publish image

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run check
        working-directory: ui
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            license-plate-ci:${{ github.sha }}
            ${{ steps.meta.outputs.tags }}
      - name: Check model-free Python image
        run: |
          docker run --rm --entrypoint python license-plate-ci:${{ github.sha }} -c "import fast_plate_ocr, ultralytics; from pathlib import Path; [compile(p.read_bytes(), str(p), 'exec') for p in Path('/app/backend').glob('*.py')]; assert (Path('/app/backend/static') / 'index.html').is_file()"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then docker push "$tag"; fi
          done <<< "$TAGS"
